version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "80:8000"
      - "8000:8000"
    env_file: .env
    restart: unless-stopped

  replicator:
    build:
      context: .
      dockerfile: app/replicator/Dockerfile
    env_file: .env
    restart: unless-stopped
    profiles:
      - replicator
