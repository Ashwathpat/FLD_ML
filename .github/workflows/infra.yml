name: Infrastructure (Terraform)

on:
  push:
    branches: [main]
    paths: ["infra/**"]
  pull_request:
    paths: ["infra/**"]

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [aws, azure, dns]
    environment: infra-${{ matrix.stack }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.x"

      # AWS + DNS stacks authenticate with OIDC
      - name: Configure AWS credentials (aws + dns stacks)
        if: matrix.stack == 'aws' || matrix.stack == 'dns'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # Azure stack authenticates with OIDC
      - name: Azure login (azure stack)
        if: matrix.stack == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/${{ matrix.stack }}

      - name: Terraform init
        run: terraform -chdir=infra/${{ matrix.stack }} init

      - name: Terraform validate
        run: terraform -chdir=infra/${{ matrix.stack }} validate

      - name: Terraform plan
        run: terraform -chdir=infra/${{ matrix.stack }} plan -out=tfplan

      # Apply only on push to main, after protected environment approval
      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform -chdir=infra/${{ matrix.stack }} apply -auto-approve tfplan
