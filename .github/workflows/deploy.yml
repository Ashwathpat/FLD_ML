name: Deploy (multi-cloud)

on:
  push:
    branches: [main]
    paths-ignore: ["infra/**", "docs/**", "*.md"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag for rollback (leave blank for fresh build)"
        required: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/fld-api

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.pick.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - id: pick
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "skip_build=true"                         >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::12}"  >> "$GITHUB_OUTPUT"
            echo "skip_build=false"       >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.pick.outputs.skip_build == 'false'

      - uses: docker/login-action@v3
        if: steps.pick.outputs.skip_build == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.pick.outputs.skip_build == 'false'
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.pick.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, azure]
    environment: ${{ matrix.cloud }}

    steps:
      - uses: actions/checkout@v4

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "infra/compose/docker-compose.yml,infra/compose/Caddyfile"
          target: "/opt/fld"
          strip_components: 2

      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/fld
            cat > .env <<EOT
            IMAGE=${{ env.IMAGE }}:${{ needs.build-push.outputs.tag }}
            CLOUD_NAME=${{ matrix.cloud }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            STORAGE_BUCKET=${{ secrets.STORAGE_BUCKET }}
            PUBLIC_HOSTNAME=${{ secrets.PUBLIC_HOSTNAME }}
            EOT
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${{ secrets.PUBLIC_HOSTNAME }}/readyz" || true)
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          exit 1

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - run: |
          for host in "${{ vars.AWS_DIRECT_HOST }}" "${{ vars.AZURE_DIRECT_HOST }}"; do
            curl -fsS -D - -o /dev/null "https://$host/readyz" | grep -i x-served-by
          done
